allowBuilds:
  sharp: true
  unrs-resolver: true
# Supply-chain policy (same locally and in CI): only install versions published at
# least 24 h (1440 min) ago. Add a version to minimumReleaseAgeExclude only when it
# must land sooner (e.g. a security fix), and remove it once it is older than that.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@types/node@24.13.4'
  - '@types/react-dom'
  - zod@4.5.4
  - zod@4.6.2
  - zod@4.6.5
  - eslint@10.9.1
  - '@next/eslint-plugin-next@16.3.2'
  - '@next/env@16.3.3'
  - '@next/env@16.3.4'
  - '@next/env@16.3.5'
  - '@next/eslint-plugin-next@16.3.3'
  - '@next/eslint-plugin-next@16.3.4'
  - '@next/eslint-plugin-next@16.3.5'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-arm64@16.3.4'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-darwin-x64@16.3.4'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.4'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.4'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.4'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.4'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.4'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.4'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - eslint-config-next@16.3.3
  - eslint-config-next@16.3.4
  - eslint-config-next@16.3.5
  - next@16.3.3
  - next@16.3.4
  - next@16.3.5
  - eslint-config-next@16.3.2
  - '@eslint/plugin-kit@0.7.3'
  - eslint@10.10.0
  - '@playwright/test@1.63.0'
  - playwright-core@1.63.0
  - playwright@1.63.0
  - react-hook-form@7.88.0
overrides:
  # typed-rest-client (via @stryker-mutator/core) pins qs@6.15.1, affected by
  # GHSA advisories fixed in 6.16.1 (same major). Drop once it ships a newer qs.
  'typed-rest-client>qs': ^6.16.1
